<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff3f6">
<title>ياسين بيحب مين؟ 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--rose:#e8456f;--pink:#ff7aa2;--blush:#ffe6ee;--ink:#46202f;--mute:#9a6c7e;--gold:#d9a35e;--ok:#17a865;--no:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;color:var(--ink);background:#fffaf8;overflow-x:hidden}
.blob{position:fixed;width:70vmax;height:70vmax;border-radius:50%;filter:blur(80px);opacity:.6;z-index:0;animation:drift 16s ease-in-out infinite alternate;pointer-events:none}
.b1{background:#ffc2d6;top:-25vmax;right:-20vmax}.b2{background:#ffe3c4;bottom:-30vmax;left:-25vmax;animation-delay:-6s}.b3{background:#ffd0ee;top:30vh;left:-30vmax;opacity:.4;animation-delay:-11s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fh{position:absolute;bottom:-50px;opacity:.6;animation:rise linear infinite}
@keyframes rise{50%{transform:translate(24px,-60vh) rotate(12deg)}to{transform:translate(-14px,-115vh) rotate(-14deg);opacity:0}}
.h{fill:currentColor;display:block}
main{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:26px 16px 50px}
.card{position:relative;background:rgba(255,255,255,.74);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.95);border-radius:32px;padding:24px 18px;box-shadow:0 30px 60px -22px rgba(232,69,111,.32),0 2px 0 #fff inset;animation:pop .6s cubic-bezier(.2,1.2,.4,1)}
.lastc{padding-bottom:38px}
@keyframes pop{from{opacity:0;transform:translateY(26px) scale(.95)}}
.center{text-align:center}
.ttl{font-family:'Aref Ruqaa','Cairo',serif;font-weight:700;font-size:2.7rem;line-height:1.35;margin:.1em 0;background:linear-gradient(100deg,#e8456f,#c2417f 55%,#d9a35e);-webkit-background-clip:text;background-clip:text;color:transparent}
p{line-height:1.9;color:var(--mute);margin:.4em 0}
.hero{position:relative;width:130px;height:130px;margin:6px auto 4px;display:grid;place-items:center;cursor:pointer}
.hero svg{width:100px;height:100px;fill:url(#g);filter:drop-shadow(0 12px 18px rgba(232,69,111,.4));animation:beat 1.3s infinite}
.hero:before,.hero:after{content:"";position:absolute;inset:14px;border-radius:50%;border:2px solid rgba(255,122,162,.5);animation:ring 2.4s infinite}
.hero:after{animation-delay:1.2s}
@keyframes ring{to{transform:scale(1.9);opacity:0}}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.2)}28%{transform:scale(1)}42%{transform:scale(1.13)}}
.btn{position:relative;overflow:hidden;font:inherit;font-weight:800;font-size:1.1rem;border:0;color:#fff;background:linear-gradient(135deg,#ff8fb0,var(--rose));padding:15px 38px;border-radius:999px;cursor:pointer;box-shadow:0 14px 28px -8px rgba(232,69,111,.55);margin-top:16px;transition:transform .15s}
.btn:after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3s infinite}
@keyframes shine{to{left:130%}}
.btn:active{transform:scale(.94)}
.tag{display:inline-block;background:#fff;color:var(--rose);font-weight:800;border-radius:99px;padding:5px 16px;font-size:.85rem;box-shadow:0 4px 14px rgba(232,69,111,.14)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px;font-weight:800;color:var(--rose);font-size:.85rem}
.segs{flex:1;display:flex;gap:4px}.segs i{flex:1;height:6px;border-radius:6px;background:#f6dfe7;transition:.4s}
.segs i.on{background:linear-gradient(90deg,#ff9bb9,var(--rose))}.segs i.cur{background:#ffc2d4;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
.q{font-size:1.5rem;font-weight:900;line-height:1.55;text-align:center;margin:4px 0}
.sub{text-align:center;font-size:.9rem;color:var(--mute);margin-bottom:20px}
.opts{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.opt{position:relative;font:inherit;font-weight:800;font-size:1.15rem;color:var(--ink);background:#fff;border:1.5px solid #f6d3df;border-radius:20px;padding:18px 8px;cursor:pointer;transition:transform .18s,border-color .2s,box-shadow .2s;box-shadow:0 8px 18px -8px rgba(232,69,111,.2);animation:pop .5s backwards}
.opt:nth-child(2){animation-delay:.06s}.opt:nth-child(3){animation-delay:.12s}.opt:nth-child(4){animation-delay:.18s}
.opt:not(:disabled):hover{border-color:var(--pink);transform:translateY(-3px)}
.opt:active:not(:disabled){transform:scale(.95)}
.opt:disabled{cursor:default}
.ok{background:linear-gradient(135deg,#eafcf2,#d4f6e4)!important;border-color:var(--ok)!important;color:#0b7a45!important;animation:glow .9s}
.no{background:linear-gradient(135deg,#fff3f3,#ffe0e0)!important;border-color:var(--no)!important;color:#b4232a!important;animation:shake .45s}
.m{position:absolute;top:-9px;left:-7px;width:27px;height:27px;border-radius:50%;color:#fff;font-size:.9rem;display:grid;place-items:center;animation:pop .35s;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.ok .m{background:var(--ok)}.no .m{background:var(--no)}
@keyframes shake{25%{transform:translateX(8px)}50%{transform:translateX(-8px)}75%{transform:translateX(4px)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(23,168,101,.55)}100%{box-shadow:0 0 0 22px rgba(23,168,101,0)}}
.fb{min-height:3em;text-align:center;font-weight:800;margin-top:18px;color:var(--rose);animation:pop .4s}
.pearl{position:absolute;left:20px;bottom:-12px;width:24px;height:24px;border-radius:99px;border:0;padding:0;cursor:pointer;color:#fff;font:800 .75rem Cairo;display:grid;place-items:center;white-space:nowrap;background:radial-gradient(circle at 30% 30%,#fff3d6,var(--gold));animation:ping 2.2s infinite;transition:width .5s cubic-bezier(.3,1.5,.5,1),height .5s,font-size .3s;z-index:5}
.pearl.open{width:98px;height:44px;font-size:1.4rem;background:linear-gradient(135deg,#ffb3cf,var(--rose));animation:ping2 1.6s infinite}
.pearl.ok{background:linear-gradient(135deg,#34d399,var(--ok))!important;color:#fff!important}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(217,163,94,.7)}80%,100%{box-shadow:0 0 0 12px rgba(217,163,94,0)}}
@keyframes ping2{0%{box-shadow:0 0 0 0 rgba(232,69,111,.55)}100%{box-shadow:0 0 0 16px rgba(232,69,111,0)}}
.meter{font-family:'Aref Ruqaa','Cairo',serif;font-size:3.6rem;font-weight:700;color:var(--rose);margin:6px 0 0;line-height:1.2}
.meter.inf{animation:pop .7s;background:linear-gradient(100deg,var(--rose),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:4.4rem}
.sec{margin-top:24px;padding-top:20px;border-top:1px dashed #f3cbd8}
.sec h3{margin:0 0 10px;color:var(--rose);font-size:1.05rem}
.hearts{display:flex;justify-content:center;gap:5px;margin:8px 0}
.letter{background:linear-gradient(#fffdf8,#fff6ea);border-radius:20px;padding:20px 18px;text-align:right;line-height:2;font-size:1.05rem;box-shadow:0 12px 28px -14px rgba(120,60,40,.35);border:1px solid #f4e3cf;min-height:190px;position:relative}
.letter .cr{display:inline-block;width:2px;height:1.1em;background:var(--rose);vertical-align:middle;animation:blink .8s infinite}
.it{background:#fff;border-radius:16px;padding:11px 14px;margin-bottom:9px;text-align:right;box-shadow:0 6px 16px -8px rgba(232,69,111,.2);animation:pop .5s backwards}
.it .t{font-weight:800;font-size:.92rem}.it .a{color:#0b7a45;font-weight:900;margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{font-size:.78rem;color:#b4232a;background:#fff0f0;border-radius:99px;padding:2px 10px;text-decoration:line-through}
.yr{font-size:.76rem;color:var(--mute);margin-top:3px}
.fx{position:fixed;pointer-events:none;z-index:50}
#mu{position:fixed;z-index:60;top:calc(12px + env(safe-area-inset-top,0px));left:12px;width:40px;height:40px;border-radius:50%;border:1px solid #fff;background:rgba(255,255,255,.8);backdrop-filter:blur(8px);font-size:1.05rem;cursor:pointer;box-shadow:0 6px 14px -6px rgba(232,69,111,.4)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}

/* Splash screen styles */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:linear-gradient(135deg,#fff3f6,#ffe6ee,#fffaf8);transition:opacity .6s,visibility .6s;overflow:hidden}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-content{text-align:center;padding:20px;animation:splashIn .8s cubic-bezier(.2,1.2,.4,1) forwards;opacity:0;transform:scale(.9)}
@keyframes splashIn{to{opacity:1;transform:scale(1)}}
.splash-heart{font-size:4.5rem;line-height:1;margin-bottom:10px;animation:splashBeat 1.2s infinite}
@keyframes splashBeat{0%,100%{transform:scale(1)}25%{transform:scale(1.15)}50%{transform:scale(1)}75%{transform:scale(1.08)}}
.splash-name{font-family:'Aref Ruqaa','Cairo',serif;font-size:4.2rem;font-weight:700;background:linear-gradient(100deg,#e8456f,#c2417f 55%,#d9a35e);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0;line-height:1.2;animation:nameShine 2s infinite}
@keyframes nameShine{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
.splash-sub{font-size:1.1rem;color:var(--mute);margin-top:8px;font-weight:600;letter-spacing:.5px}
.splash-btn{margin-top:32px;font-size:1.2rem;padding:16px 50px;animation:splashBtnIn 1s .5s cubic-bezier(.2,1.2,.4,1) forwards;opacity:0;transform:translateY(20px)}
@keyframes splashBtnIn{to{opacity:1;transform:translateY(0)}}
.splash-sparkle{position:absolute;font-size:1.5rem;opacity:0;animation:sparkleFloat 3s infinite}
@keyframes sparkleFloat{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:.8}80%{opacity:.6}100%{opacity:0;transform:translateY(-60px) scale(1.2)}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9bb9"/><stop offset="1" stop-color="#e8456f"/></linearGradient><symbol id="h" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.8 8.2 3 4.5 6.6 4.5c2 0 3.5 1 5.4 3 1.9-2 3.4-3 5.4-3 3.6 0 5.8 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/></symbol></defs></svg>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div id="bg"></div>
<button id="mu" aria-label="الصوت">🔊</button>

<!-- Splash Screen -->
<div id="splash">
  <div class="splash-content">
    <div class="splash-heart">💗</div>
    <div class="splash-name">سلمى</div>
    <div class="splash-sub">اختبار خاص جدًا… مستنياكي</div>
    <button class="btn splash-btn" id="splashGo">يلا بينا ✨</button>
  </div>
</div>

<main id="app"></main>
<script>
const $=s=>document.querySelector(s),app=$('#app'),bg=$('#bg'),ar=n=>n.toLocaleString('ar-EG');
const H=(c,s)=>`<svg class="h" style="color:${c};width:${s}px;height:${s}px"><use href="#h"/></svg>`;
const NAMES=['أحمد','محمد','محمود'],ANS='سلمى',PCT=['0%','25%','50%','100%'];

// Harder, trickier questions with misdirection
const Q=[
['ياسين بيحب مين؟','في واحدة اسمها بين حروف السؤال… ركزي كويس','سلمى طبعًا 💗'],
['لو ياسين صحي من النوم ولقى رسالة من واحدة، مين هيفرح أكتر؟','فكري في اللي بيصحى على طول عشانها','مين غير سلمى؟'],
['مين اللي لو قالت له "أنا زعلانة"، هيسيب كل حاجة ويجري؟','مش محتاجة تفكري كتير','سلمى هي الأولوية دايمًا'],
['لما ياسين يقول "وحشتيني"، لمين بيقولها؟','الكلمة دي مش بتتقال لأي حد','سلمى بس'],
['مين اللي بيفكر فيها قبل ما ينام وبعد ما يصحى؟','دي حاجة مش سر أصلاً','سلمى في كل وقت'],
['لو ياسين عنده اختيار بين أي حد وفي الدنيا، مين هيختار؟','الاختيار سهل جدًا… ولا لأ؟','سلمى من غير تفكير'],
['مين اللي بيعتبرها أمانه وسره وحياته؟','حاجة واحدة بس','سلمى هي كل ده'],
['مين اللي لو غابت يوم، يومه بيبقى ناقص؟','حاجة بسيطة بس مهمة','من غير سلمى اليوم مش كامل'],
['ياسين بيحب مين أكتر من نفسه؟','السؤال ده مش محتاج تفكير','سلمى وبس'],
['ياسين بيحبك بنسبة كام في المية؟','في حاجة صغيرة لامعة مستخبية في الصفحة… دوري عليها','الحب الحقيقي ما بيتقاسش بالأرقام']];

const LETTER='يا سلمى… لو الدنيا كلها اتقسمت أجزاء، هتفضلي إنتي أحلى جزء فيها. شكرًا إنك بتخلّي أيامي أهدى وأدفى وأحلى. بحبك بلا حدود… وبلا نهاية.\n— ياسين';
let i=0,score=0,picks=[],ghostOn=false,done=false,muted=false,ac;
const sh=a=>{a=[...a];for(let k=a.length-1;k;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a};

// sound + haptics
function tone(f,t=0,d=.3,ty='sine',v=.07){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g).connect(ac.destination);o.start(s);o.stop(s+d+.05)}catch(e){}}
const chime=()=>[784,988,1319].forEach((f,k)=>tone(f,k*.09)),oops=()=>tone(196,0,.35,'triangle',.09),fan=()=>[523,659,784,1047,1319,1568].forEach((f,k)=>tone(f,k*.12,.6));
const vib=p=>navigator.vibrate&&navigator.vibrate(p);
$('#mu').onclick=e=>{muted=!muted;e.target.textContent=muted?'🔇':'🔊'};

// ambient hearts
function floaty(){const e=document.createElement('span'),s=12+Math.random()*30;e.className='fh';
e.style.cssText=`left:${Math.random()*100}%;animation-duration:${11+Math.random()*10}s;filter:blur(${s<20?1.5:0}px)`;
e.innerHTML=H(['#ffb3c9','#ff8fb0','#f8c8a0','#ffd3e0'][Math.random()*4|0],s);bg.appendChild(e);setTimeout(()=>e.remove(),22000)}
for(let k=0;k<12;k++)setTimeout(floaty,k*350);setInterval(floaty,1000);

// particles
const COL=['#ff7aa2','#e8456f','#ffb3c9','#d9a35e','#ff9ec0'];
function piece(){const c=COL[Math.random()*5|0],e=document.createElement('span');e.className='fx';
e.innerHTML=Math.random()<.7?H(c,10+Math.random()*16):`<i style="display:block;width:7px;height:7px;border-radius:50%;background:${c}"></i>`;return e}
function burst(x,y,n=16){for(let k=0;k<n;k++){const e=piece();e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);
const a=Math.random()*6.28,d=50+Math.random()*130,dx=Math.cos(a)*d,dy=Math.sin(a)*d-60;
e.animate([{transform:'translate(-50%,-50%) scale(.3)',opacity:1},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(1)`,opacity:1,offset:.45},{transform:`translate(calc(-50% + ${dx*1.2}px),calc(-50% + ${dy+150}px)) scale(.6) rotate(${Math.random()*90-45}deg)`,opacity:0}],{duration:1100+Math.random()*500,easing:'ease-out'}).onfinish=()=>e.remove()}}
function rain(n=40){for(let k=0;k<n;k++)setTimeout(()=>{const e=piece();e.style.cssText+=`left:${Math.random()*100}vw;top:-30px`;document.body.appendChild(e);
e.animate([{transform:'translateY(0) rotate(0)',opacity:1},{transform:`translateY(106vh) rotate(${Math.random()*360-180}deg)`,opacity:.85}],{duration:2800+Math.random()*2400}).onfinish=()=>e.remove()},k*80)}
addEventListener('pointerdown',e=>{if(!e.target.closest('.opt,.pearl,.btn,#mu,#splashGo'))burst(e.clientX,e.clientY,6)});

// Splash screen logic
$('#splashGo').onclick=e=>{
  burst(e.clientX,e.clientY,24);
  chime();
  vib(25);
  $('#splash').classList.add('hide');
  setTimeout(()=>{start()},300);
};

function start(){i=0;score=0;picks=[];scrollTo(0,0);
app.innerHTML=`<div class="card center"><div class="hero" id="hero">${'<svg viewBox="0 0 24 24"><use href="#h"/></svg>'}</div>
<div class="ttl">ياسين بيحب مين؟</div>
<p>عشر أسئلة سهلة جدًا… بس فيها فكرة.<br>جاهزة تعرفي الحقيقة؟</p>
<span class="tag">اختبار خاص جدًا</span><br><button class="btn" id="go">يلا نبدأ</button></div>`;
$('#hero').onclick=e=>{burst(e.clientX,e.clientY,14);tone(660,0,.2)};
$('#go').onclick=e=>{burst(e.clientX,e.clientY,22);chime();ask()}}

function ask(){
ghostOn=false;done=false;const last=i===9,[q,sub]=Q[i],L=last?PCT:sh([...NAMES,ANS]);
app.innerHTML=`<div class="card ${last?'lastc':''}"><div class="top"><div class="segs">${Array.from({length:10},(_,k)=>`<i class="${k<i?'on':k===i?'cur':''}"></i>`).join('')}</div><span>${ar(i+1)} / ${ar(10)}</span></div>
<div class="q">${q}</div><div class="sub">${sub}</div>
<div class="opts">${L.map(t=>`<button class="opt" data-c="${t===ANS?1:0}">${t}</button>`).join('')}</div>
<div class="fb" id="fb"></div><div class="center" id="nx"></div>
${last?'<button class="pearl" id="gh" aria-label="مفاجأة"><span>✦</span></button>':''}</div>`;
document.querySelectorAll('.opt').forEach(b=>b.onclick=e=>pick(b,e));
const g=$('#gh');if(g)g.onclick=e=>{if(done)return;if(!ghostOn){openG();burst(e.clientX,e.clientY,18);chime();vib(20);$('#fb').textContent='لقيتي حاجة مستخبية! دوسي عليها تاني 💗';return}pick(g,e)}}

function openG(){const g=$('#gh');ghostOn=true;g.classList.add('open');g.firstElementChild.textContent='∞%'}
function mark(el,ok){if(!el)return;el.classList.add(ok?'ok':'no');const m=document.createElement('span');m.className='m';m.textContent=ok?'✓':'✕';el.appendChild(m)}

function pick(b,e){
if(done)return;done=true;
const bs=[...document.querySelectorAll('.opt')],last=i===9,g=$('#gh');
const ok=b.dataset.c==='1' || (b===g); // infinity is always correct
bs.forEach(x=>x.disabled=true);
if(last){if(!ghostOn)openG();g.disabled=true}
mark(b,ok);
if(!ok){ 
    const correctEl = last ? g : bs.find(x=>x.dataset.c==='1');
    if(correctEl) mark(correctEl,true);
}
if(ok){score++;burst(e.clientX,e.clientY,24);chime();vib(25);if(last)rain(30)}else{oops();vib([40,30,40])}
picks.push(ok);
$('#fb').textContent=ok?Q[i][2]:(last?'غلط! الإجابة الصح كانت ∞% 💗':'غلط 😅 الإجابة الصح اتعلّمت… سلمى دايمًا!');
document.querySelectorAll('.segs i')[i].className='on';
$('#nx').innerHTML=`<button class="btn" id="n">${last?'شوفي النتيجة 💝':'السؤال الجاي ←'}</button>`;
$('#n').onclick=()=>{i++;last?finish():ask()}}

function finish(){scrollTo(0,0);
const rev=Q.map((q,k)=>{const last=k===9,o=(last?PCT:NAMES).map(n=>`<span>✕ ${n}</span>`).join('');
return `<div class="it" style="animation-delay:${k*.06}s"><div class="t">${ar(k+1)}. ${q[0]}</div><div class="a">✓ ${last?'∞%':ANS}</div><div class="chips">${o}</div><div class="yr">${picks[k]?'جاوبتي صح 💚':'غلطتي هنا 🤭'}</div></div>`}).join('');
const msg=score===10?'١٠ من ١٠! إنتي عبقرية الحب 👑':score>=7?'شاطرة جدًا! 🌟':'ولا يهمك… الحقيقة واحدة وإنتي عارفاها';
app.innerHTML=`<div class="card center"><div class="hero" id="hero"><svg viewBox="0 0 24 24"><use href="#h"/></svg></div>
<div class="ttl">ياسين بيحبك يا سلمى</div>
<div class="meter" id="pct">0%</div>
<p>وفي كل مرة هتسألي، الإجابة هتفضل هي هي: سلمى.</p>
<div class="sec"><h3>درجتك</h3><div class="hearts">${picks.map(o=>H(o?'#e8456f':'#ecd3dc',24)).join('')}</div>
<div class="ttl" style="font-size:2.2rem" id="sc">٠ / ١٠</div><span class="tag">${msg}</span></div>
<div class="sec"><h3>رسالة من ياسين</h3><div class="letter" id="letter"><span id="lt"></span><span class="cr"></span></div></div>
<div class="sec"><h3>الإجابات الصح ونفي الباقيين</h3>${rev}</div>
<button class="btn" id="again">نعيد الاختبار 🔁</button></div>`;
$('#hero').onclick=e=>{burst(e.clientX,e.clientY,20);tone(660,0,.2)};
$('#again').onclick=start;
let p=0;const m=setInterval(()=>{p+=2;$('#pct').textContent=p+'%';if(p>=100){clearInterval(m);setTimeout(()=>{const el=$('#pct');el.textContent='∞%';el.classList.add('inf');const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+20,30);rain(50);fan();vib([30,40,30])},350)}},22);
let n=0;const t=setInterval(()=>{n++;$('#sc').textContent=ar(Math.min(n,score))+' / '+ar(10);if(n>=score)clearInterval(t)},170);
new IntersectionObserver((en,ob)=>{if(en[0].isIntersecting){ob.disconnect();let c=0;const w=setInterval(()=>{c++;$('#lt').innerHTML=LETTER.slice(0,c).replace(/\n/g,'<br>');if(c>=LETTER.length)clearInterval(w)},45)}},{threshold:.6}).observe($('#letter'))}
</script>
</body>
